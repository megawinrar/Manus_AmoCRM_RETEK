# ═══════════════════════════════════════════════════════════════════
# RETEK amoCRM Microservice — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════════════
version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: retek-amocrm
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DRY_RUN=0
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - app-backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: retek-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: retek-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  app-data:
  app-logs:
  app-backups:
  certbot-etc:
  certbot-var:
